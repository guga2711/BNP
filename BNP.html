<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Process — Gustaviana</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a4fd6;
    --blue-dark: #143ab0;
    --blue-light: #e8eef9;
    --blue-mid: #2c5fdb;
    --text: #111111;
    --text-muted: #444444;
    --text-light: #666666;
    --border: #cccccc;
    --border-light: #e5e5e5;
    --bg: #ffffff;
    --bg-gray: #f5f5f5;
    --bg-header: #1a3a6b;
    --link: #1a4fd6;
    --link-hover: #0f2f8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; color: var(--link-hover); }

  /* ── TOP BAR ── */
  .top-bar {
    background: var(--bg-header);
    color: #fff;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    border-bottom: 3px solid var(--blue);
  }

  .top-bar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .top-bar-logo svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .top-bar-name {
    font-family: 'Merriweather', serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.01em;
  }

  .top-bar-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .top-bar-right {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    text-align: right;
  }

  .top-bar-right strong { color: #fff; }

  /* ── SEARCH SECTION ── */
  .search-section {
    background: var(--bg-gray);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }

  .search-section h2 {
    font-family: 'Merriweather', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .search-row input[type="text"] {
    flex: 1;
    border: 1px solid var(--border);
    background: #fff;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    color: var(--text);
    outline: none;
    border-radius: 2px;
  }

  .search-row input[type="text"]:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(26,79,214,0.15);
  }

  .btn-search {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 8px 20px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .btn-search:hover { background: var(--blue-dark); }

  .filters-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .filter-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .filter-item label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .filter-item select {
    border: 1px solid var(--border);
    background: #fff;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    padding: 6px 28px 6px 8px;
    color: var(--text);
    outline: none;
    border-radius: 2px;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23666'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 9px center;
    cursor: pointer;
    min-width: 180px;
  }

  .filter-item select:focus { border-color: var(--blue); }

  .btn-clear-filters {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    align-self: flex-end;
  }

  .btn-clear-filters:hover {
    border-color: var(--blue);
    color: var(--blue);
  }

  /* ── LAYOUT ── */
  .main-layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 24px 60px;
  }

  /* ── RESULTS HEADER ── */
  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--blue);
  }

  .results-title {
    font-family: 'Merriweather', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .results-meta {
    font-size: 13px;
    color: var(--text-light);
  }

  .results-meta strong { color: var(--text); }

  /* ── CASE CARDS ── */
  .case-list { display: flex; flex-direction: column; gap: 0; }

  .case-card {
    padding: 18px 0;
    border-bottom: 1px solid var(--border-light);
    animation: fadeIn 0.25s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .case-title {
    font-family: 'Merriweather', serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 5px;
    line-height: 1.35;
  }

  .case-title a {
    color: var(--link);
    text-decoration: none;
    cursor: pointer;
  }

  .case-title a:hover { color: var(--link-hover); text-decoration: underline; }

  .case-title span.no-pdf {
    color: var(--text);
    cursor: default;
  }

  .case-meta-line {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 0;
  }

  .case-meta-line .meta-item {
    margin-right: 20px;
    white-space: nowrap;
  }

  .case-meta-line .meta-item strong {
    color: var(--text);
    font-weight: 600;
  }

  .case-number-line {
    font-size: 12px;
    color: var(--text-light);
    font-family: 'Source Code Pro', monospace;
    margin-bottom: 4px;
  }

  .case-category-line {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .case-category-line strong { color: var(--text); font-weight: 600; }

  .case-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
  }

  .status-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: 'Source Sans 3', sans-serif;
  }

  .status-active {
    background: #e8eef9;
    color: var(--blue);
    border: 1px solid #b0c4ef;
  }

  .status-terminated {
    background: #f0f0f0;
    color: #444;
    border: 1px solid #bbb;
  }

  .status-pending {
    background: #fff8e8;
    color: #7a5a00;
    border: 1px solid #d4b95a;
  }

  .btn-pdf-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 3px 10px;
    border-radius: 2px;
    transition: all 0.15s;
    font-family: 'Source Sans 3', sans-serif;
  }

  .btn-pdf-link:hover {
    background: var(--blue);
    color: #fff;
    text-decoration: none;
  }

  .btn-pdf-link svg { width: 12px; height: 12px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    padding: 48px 0;
    text-align: center;
    display: none;
  }

  .empty-state h3 {
    font-family: 'Merriweather', serif;
    font-size: 18px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .empty-state p { font-size: 14px; color: var(--text-light); }

  /* ── FOOTER ── */
  footer {
    background: var(--bg-header);
    color: rgba(255,255,255,0.55);
    text-align: center;
    padding: 18px 24px;
    font-size: 12px;
    border-top: 3px solid var(--blue);
  }

  footer strong { color: #fff; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
      <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="top-bar-name">Bank of Process</div>
      <div class="top-bar-sub">Gustaviana · Official Legal Repository</div>

  </div>
  <div class="top-bar-right">
    <div><strong id="hdr-total">—</strong> Total Cases &nbsp;·&nbsp; <strong id="hdr-active">—</strong> Active</div>

</div>

<!-- SEARCH SECTION -->
<div class="search-section">

  <div class="search-row">
    <input type="text" id="search" placeholder="Search by process number, case name, or court…">
    <button class="btn-search" onclick="filterData()">Search</button>
  </div>
  <div class="filters-row">
    <div class="filter-item">
      <label for="filter-category">Category</label>
      <select id="filter-category" onchange="filterData()">
        <option value="">All Categories</option>
        <option>Administrative &amp; Regulatory</option>
        <option>Administrative &amp; Regulatory (Record)</option>
        <option>Civil</option>
        <option>Civil (Labor)</option>
        <option>Civil (Record)</option>
        <option>Criminal (Felony)</option>
        <option>Family (Record)</option>
        <option>Family (Special)</option>
        <option>Family (Surrogate)</option>
        <option>Juvenile (Felony)</option>
        <option>Juvenile (Surrogate)</option>
        <option>Misdemeanor</option>
        <option>Probate &amp; Estate</option>
        <option>Probate &amp; Estate (Record)</option>
        <option>Small Claims</option>
        <option>Small Claims (Labor)</option>
        <option>Small Claims (Record)</option>
        <option>Traffic</option>
      </select>
    </div>
    <div class="filter-item">
      <label for="filter-status">Status</label>
      <select id="filter-status" onchange="filterData()">

      <select id="filter-court" onchange="filterData()">

        <option>Fifth Circuit of Appeals</option>
        <option>Sixth Circuit of Appeals</option>
        <option>Seventh Circuit of Appeals</option>
        <option>Federal Circuit of Appeals</option>
        <option>Armed Forces Court of Appeals</option>
        <option>Berma Supreme Court</option>
        <option>Comuna Supreme Court</option>
        <option>Court of Criminal Appeals</option>
        <option>Courtney Supreme Court</option>
        <option>Distrito de Morette Supreme Court</option>
        <option>Faughtar East Supreme Court</option>
        <option>Faughtar West Supreme Court</option>
        <option>Karleta Supreme Court</option>
        <option>Kentey Supreme Court</option>
        <option>Kursenai Supreme Court</option>
        <option>Leonor Supreme Court</option>
        <option>Louise Supreme Court</option>
        <option>Minnerville Supreme Court</option>
        <option>Miteola Supreme Court</option>
        <option>New Heale Supreme Court</option>
        <option>New Missikota Supreme Court</option>
        <option>North Fortissi Supreme Court</option>
        <option>North Minnerado Supreme Court</option>
        <option>Olympia Supreme Court</option>
        <option>Saun North Supreme Court</option>
        <option>Saun South Supreme Court</option>
        <option>Serena Supreme Court</option>
        <option>South Fortissi Supreme Court</option>
        <option>South Minnerado Supreme Court</option>
        <option>St. Joshep Supreme Court</option>
        <option>Umanois Supreme Court</option>
        <option>Vershire Supreme Court</option>

        <option>Washoma Supreme Court</option>
      </select>
    </div>
    <div class="filter-item">
      <label for="filter-year">Year Filed</label>
      <select id="filter-year" onchange="filterData()">
        <option value="">All Years</option>
        <option>2026</option>

        <option>2022</option>

      </select>
    </div>
    <button class="btn-clear-filters" onclick="clearFilters()">Clear Filters</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-layout">
  <div class="results-header">
    <div class="results-title">Cases</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span id="refresh-status" style="font-size:11px; color:#888;"></span>
      <button id="refresh-btn" onclick="loadData(false)" style="
        background: transparent;
        border: 1px solid #ccc;
        border-radius: 2px;
        font-family: 'Source Sans 3', sans-serif;
        font-size: 12px;
        color: #444;
        padding: 4px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all 0.15s;
      " onmouseover="this.style.borderColor='#1a4fd6';this.style.color='#1a4fd6'"
         onmouseout="this.style.borderColor='#ccc';this.style.color='#444'">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
      <div class="results-meta">Showing <strong id="shown-count">0</strong> of <strong id="all-count">0</strong> results</div>
    </div>
  </div>

  <div id="loading-msg" style="display:none; padding:32px 0; font-size:13px; color:#666;">Loading cases…</div>
  <div class="case-list" id="case-list"></div>

  <div class="empty-state" id="empty-state">
    <h3>No cases found</h3>
    <p>Try adjusting your search term or filters.</p>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <strong>Bank of Process · Gustaviana</strong> &nbsp;·&nbsp; Official Legal Repository &nbsp;·&nbsp; All Rights Reserved
</footer>

<script>
  // ─────────────────────────────────────────────
  // CONFIGURE YOUR CSV URL HERE
  // Google Sheets: File → Share → Publish to web → CSV → paste the link below
  // OneDrive: share link converted to direct download
  // ─────────────────────────────────────────────
  const CSV_URL = "https://raw.githubusercontent.com/guga2711/BNP/refs/heads/main/Bank%20Of%20Process.csv"; // ← Cole aqui a URL do seu CSV publicado

  let processes = [];

  // ── CSV PARSER ──
  function parseCSV(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(';').map(h => h.trim().toLowerCase().replace(/ /g, '_'));
    return lines.slice(1).map(line => {
      const cols = line.split(';').map(c => c.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, i) => obj[h] = cols[i] || '');
      return {
        number:   obj['number_of_process'] || '',
        name:     obj['name_of_process']   || '',
        year:     obj['year_filed']        || '',
        status:   obj['status']            || '',
        court:    obj['court']             || '',
        category: obj['category']          || '',
        pdf:      obj['pdf']               || ''
      };
    }).filter(p => p.name); // ignora linhas vazias
  }

  // ── LOAD DATA ──
  async function loadData(silent = false) {
    if (!CSV_URL) {
      processes = [
        {
          number: "494038082436.24.D.DM",
          name: "Regents of Univ. of Surry v. Gustaviana",
          year: "2024", status: "Terminated",
          court: "Federal Circuit of Appeals",
          category: "Probate & Estate (Record)", pdf: ""
        },
        {
          number: "316111148255.24.S.D.VN",
          name: "Galvan v. ProMed",
          year: "2024", status: "Terminated",
          court: "Sixth Circuit of Appeals",
          category: "Civil (Labor)", pdf: ""
        }
      ];
      init();
      return;
    }

    if (!silent) document.getElementById('loading-msg').style.display = 'block';
    setRefreshStatus('loading');

    try {
      // Cache-busting: força o GitHub a retornar a versão mais recente
      const bustUrl = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_t=' + Date.now();
      const res = await fetch(bustUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      processes = parseCSV(text);
      document.getElementById('loading-msg').style.display = 'none';
      setRefreshStatus('ok');
      init();
    } catch (err) {
      document.getElementById('loading-msg').textContent =
        '⚠ Could not load data. Check the CSV_URL or your connection.';
      setRefreshStatus('error');
      console.error(err);
    }
  }

  // ── REFRESH STATUS ──
  function setRefreshStatus(state) {
    const el = document.getElementById('refresh-status');
    const btn = document.getElementById('refresh-btn');
    const now = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    if (state === 'loading') {
      el.textContent = 'Updating…';
      el.style.color = '#888';
      btn.disabled = true;
    } else if (state === 'ok') {
      el.textContent = 'Updated at ' + now;
      el.style.color = '#2a7a2a';
      btn.disabled = false;
    } else {
      el.textContent = '⚠ Failed to load';
      el.style.color = '#c00';
      btn.disabled = false;
    }
  }

  // Auto-refresh a cada 2 minutos
  setInterval(() => loadData(true), 2 * 60 * 1000);

  // ── HELPERS ──
  function getStatusClass(status) {
    const s = (status || '').toLowerCase();
    if (s === 'active') return 'status-active';
    if (s === 'terminated') return 'status-terminated';
    return 'status-pending';
  }

  // ── RENDER ──
  function renderCases(data) {
    const list = document.getElementById('case-list');
    const empty = document.getElementById('empty-state');
    document.getElementById('shown-count').textContent = data.length;

    if (data.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = data.map((p, i) => {
      // Título: azul clicável se tem PDF, preto sem link se não tem
      const titleHtml = p.pdf
        ? `<a href="${p.pdf}" target="_blank" rel="noopener">${p.name || '—'}</a>`
        : `<span class="no-pdf">${p.name || '—'}</span>`;

      return `
      <div class="case-card" style="animation-delay:${i * 50}ms">
        <div class="case-title">${titleHtml}</div>
        <div class="case-meta-line">
          <span class="meta-item"><strong>Date Filed:</strong> ${p.year || '—'}</span>
          <span class="meta-item"><strong>Status:</strong> ${p.status || '—'}</span>
          <span class="meta-item"><strong>Court:</strong> ${p.court || '—'}</span>
        </div>
        <div class="case-number-line">Process No. ${p.number || '—'}</div>
        <div class="case-category-line"><strong>Category:</strong> ${p.category || '—'}</div>
        <div class="case-actions">
          <span class="status-badge ${getStatusClass(p.status)}">${p.status || '—'}</span>
          ${p.pdf ? `<a class="btn-pdf-link" href="${p.pdf}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
            </svg>
            View PDF</a>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  // ── FILTER ──
  function filterData() {
    const search   = document.getElementById('search').value.toLowerCase().trim();
    const category = document.getElementById('filter-category').value;
    const status   = document.getElementById('filter-status').value;
    const court    = document.getElementById('filter-court').value;
    const year     = document.getElementById('filter-year').value;

    const filtered = processes.filter(p => {
      const matchSearch = !search ||
        p.number.toLowerCase().includes(search) ||
        p.name.toLowerCase().includes(search) ||
        p.court.toLowerCase().includes(search);
      return matchSearch &&
        (!category || p.category === category) &&
        (!status   || p.status   === status)   &&
        (!court    || p.court    === court)    &&
        (!year     || p.year     === year);
    });
    renderCases(filtered);
  }

  function clearFilters() {
    ['search','filter-category','filter-status','filter-court','filter-year']
      .forEach(id => document.getElementById(id).value = '');
    filterData();
  }

  function updateStats() {
    document.getElementById('hdr-total').textContent  = processes.length;
    document.getElementById('hdr-active').textContent = processes.filter(p => p.status === 'Active').length;
    document.getElementById('all-count').textContent  = processes.length;
  }

  function init() {
    updateStats();
    filterData();
  }

  document.getElementById('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') filterData();
  });

  loadData();
